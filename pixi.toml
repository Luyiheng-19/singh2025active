[project]
name = "replicable-research-pixi"
version = "0.1.2"
description = "Reproducible research environment (Pixi-managed) — minimal starter for osx-arm64"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = "3.11.*"           # conda-style wildcard (no '==')
numpy = "==2.1.3"
scipy = ">=1.15,<1.16"      # relax to allow available build on M-series
pandas = "==2.2.3"
matplotlib = "==3.10.0"
scikit-learn = "==1.6.1"
jupyterlab = "==4.3.4"
ipykernel = "==6.29.5"
ipywidgets = "==8.1.5"

[environments]
default = { features = [], solve-group = "all" }

[tasks]
start = "jupyter lab"
